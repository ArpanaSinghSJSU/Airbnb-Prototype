apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gotour-ingress
  namespace: gotour
  annotations:
    # AWS Load Balancer Controller annotations
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    
    # Health check settings (for frontend)
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
spec:
  rules:
  - http:
      paths:
      # Backend API routes (must come before frontend catch-all)
      
      # Auth endpoints (Traveler Service)
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: traveler-service
            port:
              number: 3001
      
      # Traveler endpoints (Traveler Service)
      - path: /traveler
        pathType: Prefix
        backend:
          service:
            name: traveler-service
            port:
              number: 3001
      
      # Data endpoints (Traveler Service)
      - path: /data
        pathType: Prefix
        backend:
          service:
            name: traveler-service
            port:
              number: 3001
      
      # Owner endpoints (Owner Service)
      - path: /owner
        pathType: Prefix
        backend:
          service:
            name: owner-service
            port:
              number: 3002
      
      # Property endpoints (Property Service)
      - path: /properties
        pathType: Prefix
        backend:
          service:
            name: property-service
            port:
              number: 3003
      
      # Favorites endpoints (Property Service)
      - path: /favorites
        pathType: Prefix
        backend:
          service:
            name: property-service
            port:
              number: 3003
      
      # Booking endpoints (Booking Service)
      - path: /bookings
        pathType: Prefix
        backend:
          service:
            name: booking-service
            port:
              number: 3004
      
      # AI Agent endpoints
      - path: /api/concierge
        pathType: Prefix
        backend:
          service:
            name: ai-agent-service
            port:
              number: 8000
      
      # Frontend - catch all (must be last)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000
